{% extends "layout.html" %}
{% block content %}
<h2 class="page-title">Tools & Utilities</h2>

<div class="tool-grid">
    <div class="card tool-card">
        <h3><i class="fas fa-database"></i> Backup Database</h3>
        <p>Download a backup of your company database.</p>
        <button class="btn" onclick="alert('Backup feature coming soon!')">Download</button>
    </div>
    <div class="card tool-card">
        <h3><i class="fas fa-file-csv"></i> Export Products CSV</h3>
        <p>Export all product data to CSV.</p>
        <button class="btn" onclick="alert('Export feature coming soon!')">Export</button>
    </div>
    <div class="card tool-card">
        <h3><i class="fas fa-upload"></i> Import CSV</h3>
        <p>Upload your CSV to import products.</p>
        <button class="btn" onclick="alert('Import feature coming soon!')">Import</button>
    </div>
</div>
{% endblock %}
