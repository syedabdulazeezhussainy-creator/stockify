{% extends "layout.html" %}
{% block content %}
<h2 class="page-title">Products</h2>

<div class="card form-card">
    <h3>Add New Product</h3>
    <form method="POST" action="/products">
        <label>Product Name</label>
        <input type="text" name="name" placeholder="Product Name" required>

        <label>Selling Price (₹)</label>
        <input type="number" step="0.01" name="price" placeholder="Price" required>

        <label>Category</label>
        <select name="category" required>
            <option value="">Select Category</option>
            {% for c in categories %}
            <option value="{{ c[0] }}">{{ c[1] }}</option>
            {% endfor %}
        </select>

        <label>Supplier</label>
        <select name="supplier" required>
            <option value="">Select Supplier</option>
            {% for s in suppliers %}
            <option value="{{ s[0] }}">{{ s[1] }}</option>
            {% endfor %}
        </select>

        <button type="submit">Add Product</button>
    </form>
</div>

<h2 class="page-subtitle">Product List</h2>
<div class="card">
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>SKU</th>
                    <th>Price (₹)</th>
                    <th>Stock</th>
                    <th>Category</th>
                    <th>Supplier</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for p in products %}
                <tr {% if p[4] < 5 %}class="low-stock"{% endif %}>
                    <td>{{ p[1] }}</td>
                    <td>{{ p[2] }}</td>
                    <td>{{ p[3] }}</td>
                    <td>{{ p[4] }}</td>
                    <td>{{ p[5] }}</td>
                    <td>{{ p[6] }}</td>
                    <td>
                        <form method="POST" action="/add-stock/{{ p[0] }}" style="display:inline;">
                            <input type="number" name="quantity" placeholder="Qty" min="1" required style="width:70px;">
                            <input type="text" name="notes" placeholder="Notes" style="width:100px;">
                            <button type="submit" class="btn-sm btn-success">+</button>
                        </form>
                        <form method="POST" action="/remove-stock/{{ p[0] }}" style="display:inline;">
                            <input type="number" name="quantity" placeholder="Qty" min="1" required style="width:70px;">
                            <input type="text" name="notes" placeholder="Notes" style="width:100px;">
                            <button type="submit" class="btn-sm btn-warning">-</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
