{% extends "layout.html" %}
{% block content %}

<h2>Products</h2>

<div class="card">
    <h3>Add New Product</h3>

    <form method="POST">
        <input type="text" name="name" placeholder="Product Name" required>

        <select name="category" required>
            <option value="">Select Category</option>
            {% for c in categories %}
            <option value="{{ c[0] }}">{{ c[1] }}</option>
            {% endfor %}
        </select>

        <select name="supplier" required>
            <option value="">Select Supplier</option>
            {% for s in suppliers %}
            <option value="{{ s[0] }}">{{ s[1] }}</option>
            {% endfor %}
        </select>

        <input type="number" step="0.01" name="price" placeholder="Price" required>

        <button>Add Product</button>
    </form>
</div>


<div class="card">
    <h3>Product List</h3>

    <table>
        <tr>
            <th>Name</th>
            <th>SKU</th>
            <th>Category</th>
            <th>Supplier</th>
            <th>Price</th>
            <th>Stock</th>
        </tr>

        {% for p in products %}
        <tr class="{% if p[6] < 5 %}low-stock{% endif %}">
            <td>{{ p[1] }}</td>
            <td>{{ p[2] }}</td>
            <td>{{ p[8] }}</td>
            <td>{{ p[9] }}</td>
            <td>₹{{ p[5] }}</td>
            <td>{{ p[6] }}</td>
        </tr>
        {% endfor %}

    </table>
</div>

{% endblock %}
