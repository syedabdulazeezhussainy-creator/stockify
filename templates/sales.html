<!DOCTYPE html>
<html>
<head>
    <title>Sales</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
</div>


<div class="container">

      <div class="container page">
</div>


    <div class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/products">Products</a>
        <a href="/reports">Reports</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="card">
    <h3>🛒 New Sale</h3>

    <form method="POST" id="saleForm">

        <!-- Product search -->
        <input
            list="productList"
            name="product"
            id="productInput"
            placeholder="Search product..."
            required
        >

        <datalist id="productList">
            {% for p in products %}
                {% if p.stock > 0 %}
                    <option value="{{ p.name }}" data-stock="{{ p.stock }}">
                {% endif %}
            {% endfor %}
        </datalist>

        <!-- Quantity -->
        <input
            type="number"
            name="qty"
            id="qtyInput"
            placeholder="Quantity"
            min="1"
            required
        >

        <small id="stockInfo" style="opacity:0.8;"></small>

        <button>Sell</button>
    </form>
</div>
<script src="{{ url_for('static', filename='main.js') }}"></script>

</body>
</html>
<script>
const productInput = document.getElementById("productInput");
const qtyInput = document.getElementById("qtyInput");
const stockInfo = document.getElementById("stockInfo");

const productStock = {
    {% for p in products %}
        "{{ p.name }}": {{ p.stock }},
    {% endfor %}
};

productInput.addEventListener("input", () => {
    const selected = productInput.value;

    if (productStock[selected] !== undefined) {
        const stock = productStock[selected];
        qtyInput.max = stock;
        stockInfo.textContent = `Available stock: ${stock}`;
    } else {
        qtyInput.removeAttribute("max");
        stockInfo.textContent = "";
    }
});

qtyInput.addEventListener("input", () => {
    if (qtyInput.max && qtyInput.value > qtyInput.max) {
        qtyInput.value = qtyInput.max;
    }
});
</script>
