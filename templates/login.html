<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Stockify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

<!-- Background Animation -->
<div class="bg"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<div class="login-container fade-in">

    <div class="login-card glass">

        <h2 class="title">Welcome to <span>Stockify</span></h2>
        <p class="subtitle">Modern Inventory & Billing Application</p>

        <form method="POST">

            <h3 class="section-label">Company Details</h3>

            <div class="input-group">
                <span class="icon">🏢</span>
                <input type="text" name="company_name" placeholder="Company Name" required>
            </div>

            <div class="input-group">
                <span class="icon">🧾</span>
                <input type="text" name="gst" placeholder="GST Number" required>
            </div>

            <div class="input-group">
                <span class="icon">📦</span>
                <select name="category" required>
                    <option value="">Select Business Type</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Hardware">Hardware</option>
                    <option value="Food Items">Food Items</option>
                </select>
            </div>

            <h3 class="section-label">Login Details</h3>

            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button class="login-btn">Sign In</button>

        </form>
    </div>
</div>

</body>
</html>
