{% extends "layout.html" %}
{% block content %}

<h2>Sales Reports</h2>

<div class="card">
    <h3>Sales History</h3>

    <table>
        <tr>
            <th>Date</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Total</th>
        </tr>

        {% for s in sales %}
        <tr>
            <td>{{ s[4] }}</td>
            <td>{{ s[5] }}</td>
            <td>{{ s[2] }}</td>
            <td>₹{{ s[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
