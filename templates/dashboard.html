{% extends "layout.html" %}
{% block content %}
<h2 class="page-title">Dashboard</h2>

<div class="dashboard-cards">
    <div class="card dash-card">
        <h3>Total Products</h3>
        <p class="value">{{ total_products }}</p>
    </div>
    <div class="card dash-card">
        <h3>Total Sales (₹)</h3>
        <p class="value">{{ total_sales }}</p>
    </div>
    <div class="card dash-card">
        <h3>Low Stock Items</h3>
        <p class="value">{{ low_stock_count }}</p>
    </div>
</div>

<h2 class="page-subtitle">Quick Actions</h2>
<div class="dashboard-actions">
    <a href="/products" class="action-btn">Manage Products</a>
    <a href="/sales" class="action-btn">Record Sale</a>
    <a href="/stockin" class="action-btn">Stock In</a>
    <a href="/stockout" class="action-btn">Stock Out</a>
    <a href="/suppliers" class="action-btn">Suppliers</a>
    <a href="/reports" class="action-btn">View Reports</a>
</div>
{% endblock %}
