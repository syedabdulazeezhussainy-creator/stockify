<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | Stockify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
</div>


<div class="container">

    <div class="container page">
</div>
    <!-- Navigation -->
    <div class="nav">
        <a href="/products">Products</a>
        <a href="/sales">Sales</a>
        <a href="/reports">Reports</a>
        <a href="/logout">Logout</a>
    </div>

    <h2>📊 Dashboard</h2>

    <!-- KPI CARDS -->

<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:20px;">

    <!-- Total Revenue -->
    <a href="/reports" class="card-link">
        <div class="card">
            <h3>💰 Total Revenue</h3>
            <p style="font-size:28px;">₹ {{ total_revenue }}</p>
            <small>View reports</small>
        </div>
    </a>

    <!-- Total Products -->
    <a href="/products" class="card-link">
        <div class="card">
            <h3>📦 Total Products</h3>
            <p style="font-size:28px;">{{ total_products }}</p>
            <small>Manage products</small>
        </div>
    </a>

    <!-- Total Sales -->
    <a href="/sales" class="card-link">
        <div class="card">
            <h3>🛒 Total Sales</h3>
            <p style="font-size:28px;">{{ total_sales }}</p>
            <small>View sales</small>
        </div>
    </a>

    <!-- Low Stock -->
    <a href="/products?filter=low" class="card-link">
        <div class="card">
            <h3>⚠️ Low Stock</h3>
            <p style="font-size:28px;">{{ low_stock }}</p>
            <small>Check inventory</small>
        </div>
    </a>
</body>
</html>
