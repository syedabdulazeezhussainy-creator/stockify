<!DOCTYPE html>
<html>
<head>
    <title>Sales Inventory System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- PARTICLES BACKGROUND -->
<div id="particles-js"></div>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📦 Inventory System</span>

    {% if session.get("user") %}
    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
        <a href="/products" class="btn btn-warning btn-sm">Products</a>
        <a href="/sales" class="btn btn-success btn-sm">Sales</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
    {% endif %}
</nav>

<div class="container mt-5 page">
    {% block content %}{% endblock %}
</div>

<!-- PARTICLES SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
particlesJS.load(
  'particles-js',
  '{{ url_for("static", filename="particles.json") }}'
);
</script>
<script src="{{ url_for('static', filename='main.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
