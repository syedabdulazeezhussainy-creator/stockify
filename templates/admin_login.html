<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockify – Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body.admin-login-page {
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #1e3c72, #2a5298);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .admin-login-box {
            animation: slideInUp 0.8s ease;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }
        @keyframes slideInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .admin-login-box h2 span {
            color: #ffd700;
        }
    </style>
</head>
<body class="login-page admin-login-page">
    <div class="login-container">
        <div class="login-box admin-login-box">
            <h2>Admin <span>Access</span></h2>
            <p class="sub">Create or access your company</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="error-box">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <input type="text" name="company_name" placeholder="Company Name" required>
                <input type="text" name="gst" placeholder="GST Number" required>
                <select name="category" required>
                    <option value="">Select Business Category</option>
                    <option>Electronics</option>
                    <option>Clothing</option>
                    <option>Vehicles</option>
                    <option>Hardware</option>
                    <option>Food Items</option>
                </select>
                <input type="text" name="username" placeholder="Admin Username" required>
                <input type="password" name="password" placeholder="Admin Password" required>
                <button type="submit" class="btn-login">Sign In as Admin</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">
                <a href="/staff-login" style="color: #4a90e2;">Staff Login →</a>
            </p>
        </div>
    </div>
</body>
</html>
