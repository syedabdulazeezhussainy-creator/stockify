<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockify – Staff Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body.staff-login-page {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #6c5ce7);
            background-size: 200% 200%;
            animation: softShift 12s ease infinite;
        }
        @keyframes softShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .staff-login-box {
            animation: fadeInUp 0.8s ease;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }
        @keyframes fadeInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .staff-login-box h2 span {
            color: #a29bfe;
        }
    </style>
</head>
<body class="login-page staff-login-page">
    <div class="login-container">
        <div class="login-box staff-login-box">
            <h2>Staff <span>Login</span></h2>
            <p class="sub">Access your company dashboard</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="error-box">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <label>Select Company</label>
                <select name="company_db" required>
                    <option value="">-- Choose Company --</option>
                    {% for db_file, display_name in companies %}
                    <option value="{{ db_file }}">{{ display_name }}</option>
                    {% endfor %}
                </select>

                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn-login">Sign In as Staff</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">
                <a href="/admin-login" style="color: #6c5ce7;">Admin Login →</a>
            </p>
        </div>
    </div>
</body>
</html>
